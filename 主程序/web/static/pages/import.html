<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导入与运行</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><main class="shell"><header class="top"><h1>导入与运行</h1><nav id="nav"></nav></header><section class="card"><h2>可信快照</h2><form id="import-form"><label>快照<select id="snapshot" required></select></label><label>服务器登记摘要<input id="digest" readonly></label><label>原值 CSV<input id="file" type="file" accept=".csv,text/csv" required></label><button>导入并运行</button></form><p class="muted">上传只接受CSV；服务器重新核验manifest、full scan、源SHA和字节摘要。原始交易不进入页面日志。</p></section><section class="card"><h2>当前结果</h2><div id="message" role="status"></div><div id="summary"></div><button id="retry" hidden>仅重试已有run（不重新上传）</button></section></main><script src="/assets/js/api.js"></script><script src="/assets/js/import.js"></script></body></html>
